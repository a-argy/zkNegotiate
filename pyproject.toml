[project]
name = "zknegotiate"
version = "0.2.0"
description = "LLM negotiators that back claims with zero-knowledge proofs over signed documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "requests>=2.32",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
discord = ["discord-py>=2.4.0", "pypdf>=5.0"]
analysis = ["matplotlib>=3.9"]

[tool.uv]
package = false
