[package]
name = "zkn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Host side: proves claim bundles and verifies proofs. The guest is in ../../zk.
[features]
# Prove on an NVIDIA GPU (SP1_PROVER=cuda).
cuda = ["sp1-sdk/cuda"]

[dependencies]
anyhow = "1"
bincode = "1.3.3"
claimlang = { path = "../claimlang", default-features = false }
serde_json = "1"
sp1-sdk = "6.9.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
sp1-build = "6.9.0"
