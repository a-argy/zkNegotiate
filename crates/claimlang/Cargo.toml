[package]
name = "claimlang"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The claim checker shared by the zkVM guest and the native tools: three claim
# languages (form, formula, script), signed-document bundles, public values.
[features]
default = ["script", "cli"]
# Tier 3: Rhai scripts.
script = ["dep:rhai"]
# The `claimcheck` binary.
cli = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10.9"
ed25519-dalek = { version = "2.1", default-features = false }
rhai = { version = "1.21", optional = true, default-features = false, features = ["std", "no_module", "no_time", "no_custom_syntax"] }
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

[[bin]]
name = "claimcheck"
required-features = ["cli"]
